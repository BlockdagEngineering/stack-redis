# Keep desktop autogrouping from weakening explicit service/container priority.
kernel.sched_autogroup_enabled = 0

# Avoid swapping mining services while this host has ample RAM.
vm.swappiness = 10

# Embedded dashboard Redis uses fork-based AOF/RDB maintenance; keep this on
# before stack start so background saves do not fail under memory pressure.
vm.overcommit_memory = 1
